<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LocalMind logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2240"/>
      <stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Soft glow behind the chip -->
  <ellipse cx="128" cy="128" rx="86" ry="86" fill="#22d3ee" opacity="0.07"/>

  <!-- Chip pins -->
  <g fill="url(#accent)" opacity="0.9">
    <!-- top -->
    <rect x="100" y="60" width="10" height="24" rx="5"/>
    <rect x="123" y="60" width="10" height="24" rx="5"/>
    <rect x="146" y="60" width="10" height="24" rx="5"/>
    <!-- bottom -->
    <rect x="100" y="172" width="10" height="24" rx="5"/>
    <rect x="123" y="172" width="10" height="24" rx="5"/>
    <rect x="146" y="172" width="10" height="24" rx="5"/>
    <!-- left -->
    <rect x="60" y="100" width="24" height="10" rx="5"/>
    <rect x="60" y="123" width="24" height="10" rx="5"/>
    <rect x="60" y="146" width="24" height="10" rx="5"/>
    <!-- right -->
    <rect x="172" y="100" width="24" height="10" rx="5"/>
    <rect x="172" y="123" width="24" height="10" rx="5"/>
    <rect x="172" y="146" width="24" height="10" rx="5"/>
  </g>

  <!-- Chip body -->
  <rect x="84" y="84" width="88" height="88" rx="20" fill="none" stroke="url(#accent)" stroke-width="7"/>

  <!-- Neural core -->
  <rect x="104" y="104" width="48" height="48" rx="13" fill="url(#accent)" opacity="0.92"/>
  <g stroke="#0a0e1c" stroke-width="3" opacity="0.85">
    <line x1="119" y1="120" x2="137" y2="120"/>
    <line x1="119" y1="120" x2="128" y2="138"/>
    <line x1="137" y1="120" x2="128" y2="138"/>
  </g>
  <g fill="#0a0e1c">
    <circle cx="119" cy="120" r="6.5"/>
    <circle cx="137" cy="120" r="6.5"/>
    <circle cx="128" cy="138" r="6.5"/>
  </g>
</svg>
